# a2a-leakcheck rules: severity thresholds and mitigation hints.
#
# severity: effect size = (macro-F1 − chance) / (1 − chance), for LEAK verdicts only.
#
# rules: every rule whose `when` matches an attribute's facts adds its hint to the report, in
# file order; a matching rule with `final: true` ends the list for that attribute. A `when` key is
# a fact name (dotted for nested facts); its value must equal the fact, or be a list the fact is
# in. Facts per attribute:
#
#   attribute                         role | workflow | topology | ...
#   verdict                           LEAK | NO LEAK | INCONCLUSIVE
#   severity                          high | medium | low | none
#   top_family                        sizes | timing | counts_direction (best family alone)
#   top_family_matches_all            true when that family alone is not below all features
#   request_size_single_matches_all   true when one request-size feature alone is not below
#                                     all features (trace attributes: the first request's size;
#                                     role: bytes the agent receives)
#   family_matches_all.<family>       per family, as above
#   too_few_samples                   true when the minimum-sample check failed
#   vantage                           the observer view audited (--vantage), or null
#   padded                            every trace's sidecar has pad_buckets: the deployment pads
#                                     its requests (scripts/collect_session.py, arm option pad=...)
#   unpadded_in_view                  padded, and the view also sees endpoints missing from the
#                                     sidecar's padded_endpoints (in C2 at V1, the ticket service)
#
# The first two rules are for edge-cloud deployments (C2's sidecar attributes escalated and
# cloud_role, docs/LAN_SETUP.md); an attribute of another name is unaffected.
#
# Docs: docs/EXTENDING.md, "A new rule".

severity:
  high: 0.6
  medium: 0.3

rules:
  - id: hide-escalation
    when: {verdict: LEAK, attribute: escalated}
    final: true
    hint: >-
      Whether the edge called the cloud is visible from the connections themselves, and padding
      cannot hide a call that did or did not happen. Make every task look alike upstream: dummy
      cloud calls at a fixed rate (cover traffic), or send every task to the cloud. Then re-run the
      audit.

  - id: one-cloud-front-end
    when: {verdict: LEAK, attribute: cloud_role}
    final: true
    hint: >-
      Each cloud agent has its own address and TLS server name, which tell an observer which agent
      served the task whatever the traffic's shape (this audit scores the shape alone). Put the
      cloud agents behind one front end, one address and server name, then re-run the audit to see
      whether the shape still gives the agent away.

  - id: padding-not-enough-timing
    when: {verdict: LEAK, padded: true, top_family: timing}
    hint: >-
      The requests are padded, yet the attribute still leaks and timing carries it: padding is not
      enough. Shape the response timing as well (replies at a fixed rate or in batches, delays that
      do not follow the work done), then re-run the audit.

  - id: pad-task-inputs
    when: {verdict: LEAK, request_size_single_matches_all: true}
    hint: >-
      One request-size feature alone matches all features: the size of the task input gives the
      attribute away. Pad request bodies to fixed size buckets (AgentConfig.pad_buckets; in this
      testbed the session collector's arm option pad=B1/B2/...), with buckets wide enough that
      the inputs of different classes share one. Padding task inputs may not remove the leak:
      other size and timing features can still carry it. Re-run the audit on the padded
      deployment.

  - id: pad-messages
    when: {verdict: LEAK, top_family: sizes, request_size_single_matches_all: false}
    hint: >-
      Message sizes carry the leak, beyond any single request. Pad streamed response events to
      fixed cells (defense=pad) as well as request bodies to buckets.

  - id: shape-timing
    when: {verdict: LEAK, top_family: timing, padded: false}
    hint: >-
      Timing carries the leak. Add jitter and reordering to delegations (defense=rate), or batch
      responses so their timing no longer follows the work done.

  - id: fix-message-counts
    when: {verdict: LEAK, top_family: counts_direction}
    hint: >-
      Message counts and direction carry the leak. Keep the number of calls per agent constant
      and add dummy calls (defense=rate).

  - id: pad-local-posts
    when: {verdict: LEAK, padded: true, unpadded_in_view: true}
    hint: >-
      This view also sees requests that are not padded, such as posts to a local service (in C2,
      the ticket service on the building network). Pad posts to local services too, then re-run the
      audit; the audit of a view without them shows what they add.

  - id: topology-structure
    when: {verdict: LEAK, attribute: topology}
    hint: >-
      Which agents talk to each other is visible from the connections themselves, whatever
      their content. Hiding topology needs a constant call pattern (every agent called in every
      task) or relaying all calls through one endpoint.

  - id: role-endpoints
    when: {verdict: LEAK, attribute: role}
    hint: >-
      Each agent's traffic profile identifies its role. Put agents behind one endpoint, or pad
      their requests and responses to common sizes.

  - id: collect-more
    when: {verdict: INCONCLUSIVE, too_few_samples: true}
    hint: >-
      Too few samples per class for a verdict: collect more traces (at least min_per_class per
      class, from at least as many prompt groups as folds).

  - id: inconclusive
    when: {verdict: INCONCLUSIVE, too_few_samples: false}
    hint: >-
      The interval straddles chance + margin: more traces will narrow it. Re-run before
      treating this attribute as safe.
