# configs/c2_network.conf — C2 network (docs/LAN_SETUP.md): the Pi and the Mac on the home Wi-Fi.
# Every C2 script reads this file (shell scripts source it; Python reads it with
# agents.edge.c2_network); an environment
# variable of the same name overrides a value, and a script's command-line flag overrides both.
# C2_PI and C2_CLOUD are left empty until confirmed: the C2 scripts stop rather than guess an
# address on the home network.

C2_IFACE=en0            # the Mac's Wi-Fi interface: capture (tcpdump -p) and WAN emulation (dummynet)
C2_MAC=10.0.0.228       # the Mac's own address: the ticket service (the building server)
C2_PI=10.0.0.171        # the Pi's reserved address on the Wi-Fi (DHCP reservation on the router)
C2_CLOUD=172.30.0.100   # the cloud alias on the Mac, outside the home LAN: the Pi reaches it by a host
                        # route via C2_MAC (docs/LAN_SETUP.md, section 2); the router never sees it
C2_PI_IFACE=wlan0       # the Pi's Wi-Fi interface (only for the WAN-emulation fallback on the Pi)
C2_PI_USER=ms           # the Pi's login user, for ssh, scp and rsync from the Mac
C2_BASES=8100,8200,8300  # the arms' port bases (cloud B+1, B+2, tickets B+5, trigger B+9)
